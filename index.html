<script>
    // Mostrar/ocultar campos condicionales
    document.getElementById('empresa').addEventListener('change', function() {
        document.getElementById('empresaOtroGroup').style.display = this.value === 'Otra' ? 'block' : 'none';
    });
    
    document.getElementById('area').addEventListener('change', function() {
        document.getElementById('areaOtroGroup').style.display = this.value === 'Otra' ? 'block' : 'none';
    });
    
    document.getElementById('herramientasOtra').addEventListener('change', function() {
        document.getElementById('herramientasOtroGroup').style.display = this.checked ? 'block' : 'none';
    });
    
    document.getElementById('tareasOtra').addEventListener('change', function() {
        document.getElementById('tareasOtroGroup').style.display = this.checked ? 'block' : 'none';
    });
    
    document.querySelector('input[name="tipoCuenta"][value="Otra"]').addEventListener('change', function() {
        document.getElementById('tipoCuentaOtroGroup').style.display = this.checked ? 'block' : 'none';
    });
    
    // Enviar formulario SIN FETCH (form submission puro)
    document.getElementById('encuestaForm').addEventListener('submit', function(e) {
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Enviando...';
        
        // El formulario se enviará automáticamente al Apps Script
        // Mostrar mensaje de éxito después de 2 segundos
        setTimeout(() => {
            showMessage('Respuesta guardada correctamente', 'success');
            document.getElementById('encuestaForm').reset();
            document.getElementById('timestamp').value = new Date().toISOString();
            submitBtn.disabled = false;
            submitBtn.textContent = 'Enviar Respuesta';
            
            // Ocultar campos condicionales
            document.getElementById('empresaOtroGroup').style.display = 'none';
            document.getElementById('areaOtroGroup').style.display = 'none';
            document.getElementById('herramientasOtroGroup').style.display = 'none';
            document.getElementById('tareasOtroGroup').style.display = 'none';
            document.getElementById('tipoCuentaOtroGroup').style.display = 'none';
        }, 2000);
    });
    
    function showMessage(text, type) {
        const messageDiv = document.getElementById('message');
        messageDiv.textContent = text;
        messageDiv.className = 'message ' + type;
        
        // Auto-ocultar después de 5 segundos
        setTimeout(() => {
            messageDiv.className = 'message';
        }, 5000);
    }
    
    // Establecer timestamp y action al cargar
    document.getElementById('timestamp').value = new Date().toISOString();
    document.getElementById('encuestaForm').action = 'https://script.google.com/macros/s/AKfycbwzgZGtA-DAOzc0ld4N90cSejx42w85ZpcWk0j7qkJzLkOmkSlOlealvpWPnO9d5dE2yA/exec';
    document.getElementById('encuestaForm').method = 'POST';
</script>
